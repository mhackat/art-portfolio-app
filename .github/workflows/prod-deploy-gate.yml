name: Prod deploy gate

# Vercel deploys Production the instant a commit lands on `main`, so the only
# way to actually run the API test suite "before" that deploy is to gate the
# merge itself. This runs on every PR targeting `main` and is wired up as a
# required status check in branch protection — see README.md "Push workflow".
#
# Runs the whole suite, admin tests included, against the `test` environment
# (art-portfolio-app-plumtest.vercel.app), never Production.
#
# The @admin-tagged specs need ADMIN_EMAIL/ADMIN_PASSWORD below; without them
# they skip rather than fail, so a missing secret quietly narrows coverage
# instead of breaking the gate.
#
# `test` must be kept up to date with `main`, or the suite will be exercising
# older code than the PR it is gating.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  api-tests:
    name: API tests (test environment)
    runs-on: ubuntu-latest
    steps:
      - name: Check out art-portfolio-api-tests
        uses: actions/checkout@v4
        with:
          repository: mhackat/art-portfolio-api-tests
          ref: main
          token: ${{ secrets.API_TESTS_REPO_TOKEN }}
          path: api-tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: api-tests/package-lock.json

      - name: Install dependencies
        working-directory: api-tests
        run: npm ci

      - name: Run API tests against the test environment
        working-directory: api-tests
        env:
          API_BASE_URL: https://art-portfolio-app-plumtest.vercel.app
          API_AUTOMATION_USERNAME: ${{ secrets.API_AUTOMATION_USERNAME }}
          API_AUTOMATION_EMAIL: ${{ secrets.API_AUTOMATION_EMAIL }}
          API_AUTOMATION_PASSWORD: ${{ secrets.API_AUTOMATION_PASSWORD }}
          API_AUTOMATION_DISPLAY_NAME: ${{ secrets.API_AUTOMATION_DISPLAY_NAME }}
          # Admin-tagged specs (tests/admin/*, tests/auth/signup.spec.ts) skip
          # themselves when these are absent, so the gate still runs — it just
          # covers less. Set both repository secrets to an account that is in the
          # test environment's own ADMIN_EMAILS.
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: npm run test:ci

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: api-tests/playwright-report
          retention-days: 14

version: "3.8"
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: art_portfolio
    ports:
      - "5432:5432"
    volumes:
      - art_portfolio_db_data:/var/lib/postgresql/data

volumes:
  art_portfolio_db_data:
